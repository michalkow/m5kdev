services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: m5kdev
      POSTGRES_USER: m5kdev
      POSTGRES_PASSWORD: m5kdev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m5kdev -d m5kdev"]
      interval: 2s
      timeout: 2s
      retries: 30
  pgbouncer:
    build:
      context: .
      dockerfile: Dockerfile.pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:6432:6432"
volumes:
  postgres_data:
